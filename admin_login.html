<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landigo Express Admin - Connexion Sécurisée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 font-sans text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl relative">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-white">Land<span class="text-orange-500">igo</span> Express</h1>
            <p class="text-xs text-slate-400 mt-1">Espace Administration & Gestion de la BDD</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6">
            <div id="errorAlert" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold text-center">
                Identifiants incorrects. Veuillez réessayer.
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Identifiant Admin</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-user text-sm"></i></span>
                    <input type="text" id="username" required placeholder="admin" class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none text-white transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Mot de Passe</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-lock text-sm"></i></span>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none text-white transition">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-4 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-extrabold rounded-xl shadow-lg shadow-orange-500/25 transition transform hover:scale-[1.02]">
                <i class="fa-solid fa-shield-halved mr-2"></i> Se Connecter au Back-Office
            </button>
        </form>

        <div class="mt-8 text-center border-t border-slate-700/60 pt-4">
            <a href="/" class="text-xs text-slate-400 hover:text-orange-400 transition"><i class="fa-solid fa-arrow-left mr-1"></i> Retour au site landigo-express.com</a>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('errorAlert');
            alertBox.classList.add('hidden');

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('landigo_admin_token', data.token);
                    window.location.href = '/admin';
                } else {
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.innerText = "Erreur de connexion au serveur.";
                alertBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
