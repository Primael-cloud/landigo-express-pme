services:
  - type: web
    name: landigo-express
    env: docker
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8080
      - key: DOMAIN_NAME
        value: https://landigo-express.com
      - key: CINETPAY_MODE
        value: sandbox
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: landigo2026!
